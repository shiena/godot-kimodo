# Runs on every push and pull request, to check that both targets still build.
#
# One Linux runner builds both. Windows is crossed with mingw-w64 rather than
# built on a Windows runner, so there is a single container to keep working and
# one place the Vulkan SDK has to be installed.

name: Continuous Integration
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

jobs:
  build:
    name: ${{ matrix.target.platform }} ${{ matrix.target-type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # kimodo.cpp needs a C++23 compiler and the GGML Vulkan backend, and its
        # 8B text encoder needs desktop-class VRAM, so x86_64 Linux and Windows
        # are the only targets this extension ships for. One target type each is
        # enough here; make_build.yml builds both.
        include:
          - target: { platform: linux, arch: x86_64 }
            target-type: template_debug
            float-precision: single
          - target: { platform: windows, arch: x86_64 }
            target-type: template_release
            float-precision: single

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Recursive: kimodo.cpp carries ggml, and kmd-generate does not build
          # without it.
          submodules: recursive

      - name: Setup Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install SCons
        shell: bash
        run: python -m pip install --upgrade scons

      - name: Setup the cross build
        uses: ./.github/actions/setup-cross-build

      - name: Restore .scons-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache/
          key: scons-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-

      # CMake keeps its own dependency graph and GGML's Vulkan shaders take
      # longer to compile than everything else here put together, so the build
      # tree is carried between runs and only invalidated when the submodule
      # or the toolchain moves.
      - name: Restore the kimodo.cpp build tree
        uses: actions/cache@v4
        with:
          path: kimodo.cpp/build/
          key: kimodo-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('.git/modules/kimodo.cpp/HEAD', 'misc/toolchains/*.cmake', 'patches/*.patch') }}

      - name: Build
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          if [ "${{ matrix.target.platform }}" = "windows" ]; then
            export KIMODO_CMAKE_ARGS="${KIMODO_WINDOWS_CMAKE_ARGS}"
          fi
          scons \
            target=${{ matrix.target-type }} \
            platform=${{ matrix.target.platform }} \
            arch=${{ matrix.target.arch }} \
            precision=${{ matrix.float-precision }}

      - name: Show what came out
        shell: bash
        run: find project/addons/kimodo/bin -type f -printf '%10s  %p\n' | sort -k2
