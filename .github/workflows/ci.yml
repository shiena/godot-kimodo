# Runs on every push and pull request, to check that both targets still build.
#
# Each platform is built on its own runner with its own native toolchain.
# Windows is MSVC: the compiler kimodo.cpp's CMakeLists has a branch for, and
# the one the patches in patches/ were written against.

name: Continuous Integration
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

jobs:
  build:
    name: ${{ matrix.target.platform }} ${{ matrix.target-type }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # kimodo.cpp needs a C++23 compiler and the GGML Vulkan backend, and its
        # 8B text encoder needs desktop-class VRAM, so x86_64 Linux and Windows
        # are the only targets this extension ships for. One target type each is
        # enough here; make_build.yml builds both.
        include:
          - target: { platform: linux, arch: x86_64, os: ubuntu-24.04 }
            target-type: template_debug
            float-precision: single
          - target: { platform: windows, arch: x86_64, os: windows-2022 }
            target-type: template_release
            float-precision: single

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Recursive: kimodo.cpp carries ggml, and kmd-generate does not build
          # without it.
          submodules: recursive

      - name: Setup the build
        uses: ./.github/actions/setup-build
        with:
          platform: ${{ matrix.target.platform }}

      - name: Restore .scons-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache/
          key: scons-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-

      # CMake keeps its own dependency graph, and GGML's Vulkan shaders take
      # longer to compile than everything else here put together, so the build
      # tree is carried between runs and thrown away only when the submodule or
      # the patches move.
      - name: Restore the kimodo.cpp build tree
        uses: actions/cache@v4
        with:
          path: kimodo.cpp/build/
          key: kimodo-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('.git/modules/kimodo.cpp/HEAD', 'patches/*.patch') }}

      - name: Build
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: >-
          scons
          target=${{ matrix.target-type }}
          platform=${{ matrix.target.platform }}
          arch=${{ matrix.target.arch }}
          precision=${{ matrix.float-precision }}

      - name: Show what came out
        shell: bash
        run: ls -l project/addons/kimodo/bin/${{ matrix.target.platform }}/

      # kmd-generate loads the ggml libraries from beside itself, so a build
      # that produced the one and not the others is a build that cannot run.
      # It has happened: the libraries are written straight into the addon by
      # CMake, and a scons cache hit on the executable alone used to skip
      # CMake entirely.
      - name: Check the generator has its libraries
        shell: bash
        run: |
          set -euo pipefail
          bin="project/addons/kimodo/bin/${{ matrix.target.platform }}"
          if ! find "$bin" -name 'kmd-generate*' -print -quit | grep -q .; then
            echo "kmd-generate was not built, so it needs nothing beside it."
            exit 0
          fi
          if ! find "$bin" -name '*ggml*' -print -quit | grep -q .; then
            echo "::error::kmd-generate was built without the ggml libraries it loads"
            exit 1
          fi
