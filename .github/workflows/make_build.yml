# Builds every target and publishes addons/kimodo as a release asset.
# Run it by hand from the Actions tab, giving the version to cut.
#
# Each platform is built on its own runner with its own native toolchain.
# See .github/actions/setup-build for what each of them needs.

name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0)'
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version goes forward
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          LATEST=$(git tag -l 'v*' | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then
            echo "No tags yet, so ${VERSION} is the first."
            exit 0
          fi
          HIGHER=$(printf '%s\n%s' "${LATEST#v}" "$VERSION" | sort -V | tail -n1)
          if [ "$HIGHER" = "${LATEST#v}" ]; then
            echo "::error::${VERSION} is not above the latest tag ${LATEST}"
            exit 1
          fi
          echo "${VERSION} is above ${LATEST}."

  build:
    needs: [prepare]
    name: ${{ matrix.target.platform }} ${{ matrix.target-type }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matches the platforms in project/addons/kimodo/kimodo.gdextension,
        # which are the ones kimodo.cpp itself supports.
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-24.04 },
            { platform: windows, arch: x86_64, os: windows-2022 },
          ]
        target-type: [template_debug, template_release]
        float-precision: [single]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup the build
        uses: ./.github/actions/setup-build
        with:
          platform: ${{ matrix.target.platform }}

      - name: Restore .scons-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons-cache/
          key: scons-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-

      - name: Restore the kimodo.cpp build tree
        uses: actions/cache@v4
        with:
          path: kimodo.cpp/build/
          key: kimodo-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('.git/modules/kimodo.cpp/HEAD', 'patches/*.patch') }}

      - name: Build
        shell: bash
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons \
            target=${{ matrix.target-type }} \
            platform=${{ matrix.target.platform }} \
            arch=${{ matrix.target.arch }} \
            precision=${{ matrix.float-precision }}

      - name: Drop what only the linker needed
        shell: bash
        run: |
          find project/addons/kimodo/bin -type f \
            \( -name '*.exp' -o -name '*.lib' -o -name '*.pdb' -o -name '*.a' \) -delete
          find project/addons/kimodo/bin -type f -printf '%10s  %p\n' | sort -k2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimodo-bin-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: project/addons/kimodo/bin
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every build
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kimodo-bin-*

      - name: Assemble addons/kimodo
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i "s/^version=\".*\"/version=\"${VERSION}\"/" project/addons/kimodo/plugin.cfg
          cat project/addons/kimodo/plugin.cfg

          # A top-level folder holding addons/, which is the shape the asset
          # library and a plain unzip-into-the-project both expect.
          mkdir -p godot-kimodo/addons
          cp -r project/addons/kimodo godot-kimodo/addons/
          # Apache 2.0 asks for the licence and the notice to travel with what
          # they cover, and what travels is the folder someone copies into a
          # project of their own.
          cp LICENSE NOTICE godot-kimodo/addons/kimodo/
          mkdir -p godot-kimodo/addons/kimodo/bin
          # Every build wrote into bin/<platform>/, so the four of them merge.
          for built in artifacts/kimodo-bin-*/; do
            cp -r "${built}"* godot-kimodo/addons/kimodo/bin/
          done

          echo "What ships:"
          find godot-kimodo -type f -printf '%10s  %p\n' | sort -k2

          # Both platforms have to be in it, or the extension fails to load for
          # half the people who download it.
          for platform in linux windows; do
            if ! find "godot-kimodo/addons/kimodo/bin/${platform}" -name '*kimodo*' -print -quit | grep -q .; then
              echo "::error::no ${platform} library in the archive"
              exit 1
            fi
          done

          zip -qr "godot-kimodo-v${VERSION}.zip" godot-kimodo/
          ls -l "godot-kimodo-v${VERSION}.zip"

      - name: Record the version and tag it
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only plugin.cfg: built libraries stay out of the repository and
          # reach people through the release asset instead.
          git add project/addons/kimodo/plugin.cfg
          git commit -m "Release v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            "godot-kimodo-v${VERSION}.zip"

      - name: Delete the intermediate artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: kimodo-bin-*
